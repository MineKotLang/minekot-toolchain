# MineKot toolchain verification
name: Build and check

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, test, and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-read-only: ${{ github.event_name != 'push' }}

      - name: Bootstrap current toolchain artifacts
        run: >-
          ./gradlew publishToMavenLocal --warning-mode=fail --no-scan --no-daemon
          --no-configuration-cache --no-build-cache

      - name: Execute toolchain verification
        run: >-
          ./gradlew check mineKotSmokeTest --warning-mode=fail --no-scan --no-daemon
          --no-configuration-cache --no-build-cache
